server {
    listen 80;

    # Static frontend (the Vite build)
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri /index.html;   # hash-router friendly
    }

    # Same-origin API: the browser talks only to this server; nginx forwards
    # /api/* to the api container over docker's internal network. The api
    # container's port is never published to the host.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;      # deck builds / slow endpoints
        client_max_body_size 50m;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
