[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-fmri-qa"
version = "1.0.0"
description = "Automated QC for fMRIPrep outputs: motion/artifact metrics, versioned criteria, LLM figure review, review app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishanth Basava", email = "nishanthrbasava@gmail.com" }]
keywords = ["fmri", "fmriprep", "neuroimaging", "quality-control", "adni"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Core = the deterministic pipeline. Everything else is opt-in.
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
render = ["playwright>=1.40"]                       # SVG -> JPEG; then: playwright install chromium
llm = ["anthropic>=0.40", "chromadb>=1.0", "python-dotenv>=1.0"]
web = [
  "fastapi>=0.110", "uvicorn>=0.29", "python-dotenv>=1.0",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1",
  "pyjwt>=2.8", "argon2-cffi>=23.1",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]
all = ["auto-fmri-qa[render,llm,web]"]

[project.scripts]
autoqa = "autoqa.cli:main"

[project.urls]
Repository = "https://github.com/nishanthbasava/auto-fmri-qa"

[tool.setuptools.packages.find]
include = ["autoqa*"]

[tool.setuptools.package-data]
autoqa = ["data/*.yaml", "data/knowledge/*.md", "agents/prompts/*.md", "report/*.js",
          "db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["render: needs playwright + chromium", "node: needs node + pptxgenjs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"autoqa/api/*.py" = ["B008"]   # FastAPI's Depends() in defaults is the framework idiom
